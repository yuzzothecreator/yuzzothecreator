<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yuzzo The Creator">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="55%" stop-color="#0b0d11"/>
      <stop offset="100%" stop-color="#0e1620"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2eb67d"/>
      <stop offset="50%" stop-color="#45d3e8"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12161d"/>
      <stop offset="100%" stop-color="#0c1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#45d3e8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#45d3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <path d="M0 300 C180 260 320 330 500 290 C700 245 860 320 1200 270 L1200 360 L0 360 Z" fill="#0a1218" opacity="0.65"/>

  <!-- Brand mark -->
  <g transform="translate(72,78)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#101820" stroke="#45d3e8" stroke-opacity="0.45"/>
    <rect x="14" y="14" width="28" height="28" rx="6" fill="none" stroke="url(#cyan)" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="4" fill="#45d3e8"/>
    <path d="M28 14 V8 M28 48 V42 M14 28 H8 M48 28 H42" stroke="#45d3e8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="148" y="102" fill="#e8eef5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">YUZZO THE CREATOR</text>
  <text x="148" y="128" fill="#7f93a8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.2">CREATIVE MINDS, SECURE SOLUTIONS</text>

  <text x="72" y="198" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Software with clarity,</text>
  <text x="72" y="248" fill="url(#cyan)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">before the noise.</text>
  <text x="72" y="290" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Full-stack products for East Africa  fintech, security, and ops SaaS.</text>

  <!-- Right dashboard card -->
  <g transform="translate(760,78)">
    <rect width="360" height="210" rx="18" fill="url(#panel)" stroke="#1e2936"/>
    <circle cx="22" cy="22" r="5" fill="#ef4444"/>
    <circle cx="40" cy="22" r="5" fill="#eab308"/>
    <circle cx="58" cy="22" r="5" fill="#22c55e"/>

    <rect x="24" y="48" width="96" height="64" rx="12" fill="#0f141b" stroke="#1f2a36"/>
    <text x="36" y="78" fill="#45d3e8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">24/7</text>
    <text x="36" y="98" fill="#7f93a8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">build focus</text>

    <rect x="132" y="48" width="96" height="64" rx="12" fill="#0f141b" stroke="#1f2a36"/>
    <text x="144" y="78" fill="#45d3e8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">&lt;5m</text>
    <text x="144" y="98" fill="#7f93a8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">ship cycles</text>

    <rect x="240" y="48" width="96" height="64" rx="12" fill="#0f141b" stroke="#1f2a36"/>
    <text x="252" y="78" fill="#45d3e8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">360°</text>
    <text x="252" y="98" fill="#7f93a8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">product view</text>

    <rect x="24" y="128" width="200" height="62" rx="12" fill="#0f141b" stroke="#1f2a36"/>
    <text x="36" y="152" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Delivery posture</text>
    <rect x="36" y="164" width="16" height="14" fill="#45d3e8" opacity="0.95" rx="2"/>
    <rect x="56" y="158" width="16" height="20" fill="#45d3e8" opacity="0.75" rx="2"/>
    <rect x="76" y="152" width="16" height="26" fill="#45d3e8" opacity="0.9" rx="2"/>
    <rect x="96" y="156" width="16" height="22" fill="#45d3e8" opacity="0.7" rx="2"/>
    <rect x="116" y="146" width="16" height="32" fill="#45d3e8" opacity="1" rx="2"/>
    <rect x="136" y="150" width="16" height="28" fill="#2eb67d" opacity="0.9" rx="2"/>
    <rect x="156" y="142" width="16" height="36" fill="#45d3e8" opacity="0.85" rx="2"/>
    <text x="180" y="168" fill="#2eb67d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">+12%</text>

    <rect x="236" y="128" width="100" height="62" rx="12" fill="#0f141b" stroke="#1f2a36"/>
    <text x="248" y="152" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Clarity</text>
    <text x="248" y="178" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">94</text>
  </g>
</svg>
